name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/platform/**'
      - 'terraform/catalog/**'
      - 'terraform/workspaces/**'

permissions:
  contents: read
  # GCS backend への Workload Identity 連携で OIDC トークンを発行するのに必要
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      phase1: ${{ steps.detect.outputs.phase1 }}
      phase2: ${{ steps.detect.outputs.phase2 }}
      phase3: ${{ steps.detect.outputs.phase3 }}
      phase4: ${{ steps.detect.outputs.phase4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          # HEAD~1 HEAD だと push に複数コミットが含まれる場合に
          # 最後の1コミットしか diff されず、途中のコミットの変更が
          # 無視されてしまう（実際に踏んだ）。push イベントの before/after
          # レンジ全体を見る。force-push 等で before が存在しない場合は
          # HEAD~1 にフォールバックする。
          before="${{ github.event.before }}"
          if ! git cat-file -e "$before" 2>/dev/null; then
            before="HEAD~1"
          fi
          changed=$(git diff --name-only "$before" "${{ github.event.after }}")

          # platform/ は backend.tf を持つ最も近い祖先ディレクトリを root module
          # とする（idp/ のようなフラット構成と openstack/quotas/ のような
          # ネスト構成が混在するため。scripts/detect-platform-stacks.sh 参照）
          phase1=$(echo "$changed" | scripts/detect-platform-stacks.sh \
            | jq -R -s -c 'split("\n")[:-1]')

          phase2=$(echo "$changed" \
            | grep -E '^terraform/catalog/billing-accounts/' \
            | awk -F'/' '{print $1"/"$2"/"$3"/"$4"/"$5}' \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          phase3_raw=$(echo "$changed" \
            | grep -E '^terraform/catalog/(teams|projects)/' \
            | awk -F'/' '{print $1"/"$2"/"$3"/"$4}' \
            | sort -u)
          if echo "$changed" | grep -qE '^terraform/catalog/'; then
            phase3_raw=$(printf '%s\nterraform/platform/github' "$phase3_raw")
          fi
          phase3=$(echo "$phase3_raw" | grep -v '^$' | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          phase4=$(echo "$changed" \
            | grep -E '^terraform/workspaces/' \
            | awk -F'/' '{print $1"/"$2"/"$3"/"$4}' \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "phase1=$phase1" >> "$GITHUB_OUTPUT"
          echo "phase2=$phase2" >> "$GITHUB_OUTPUT"
          echo "phase3=$phase3" >> "$GITHUB_OUTPUT"
          echo "phase4=$phase4" >> "$GITHUB_OUTPUT"

  apply-phase1:
    needs: detect-changes
    if: needs.detect-changes.outputs.phase1 != '[]'
    strategy:
      matrix:
        stack: ${{ fromJson(needs.detect-changes.outputs.phase1) }}
      fail-fast: false
    concurrency:
      group: apply-${{ matrix.stack }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # state 置き場の GCS バケットへ Workload Identity 連携で認証する。
      # サービスアカウントキーは発行しない（鍵の持ち回りが要らない）。
      - name: GCP 認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/897661050223/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-tfstate@main-vcompute.iam.gserviceaccount.com

      # scripts/decrypt-members.sh が使う。ubuntu-latest には同梱されていない
      - name: sops インストール
        run: |
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: SOPS 復号キー設定
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt

      - name: メンバーファイル復号
        run: scripts/decrypt-members.sh

      - name: Apply
        working-directory: ${{ matrix.stack }}
        env:
          # middleware-api-infra 用の非秘密 JSON。他 root では未宣言のため無視される。
          TF_VAR_vm_config: ${{ vars.MIDDLEWARE_API_VM_CONFIG }}
          TF_VAR_authentik_token: ${{ secrets.AUTHENTIK_TOKEN }}
          TF_VAR_smtp_host: ${{ secrets.SMTP_HOST }}
          TF_VAR_smtp_port: ${{ secrets.SMTP_PORT }}
          TF_VAR_smtp_username: ${{ secrets.SMTP_USERNAME }}
          TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
          TF_VAR_smtp_use_tls: ${{ secrets.SMTP_USE_TLS }}
          TF_VAR_smtp_use_ssl: ${{ secrets.SMTP_USE_SSL }}
          TF_VAR_smtp_from_address: ${{ secrets.SMTP_FROM_ADDRESS }}
          # GitHub は GITHUB_ で始まるシークレット名を予約していて登録できない
          # （HTTP 422: Secret names must not start with GITHUB_）。
          # GITHUB_OAUTH_CLIENT_ID という名前では永久に空が渡るため GH_ 始まりにしている。
          TF_VAR_github_oauth_client_id: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          TF_VAR_github_oauth_client_secret: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          TF_VAR_discord_oauth_client_id: ${{ secrets.DISCORD_OAUTH_CLIENT_ID }}
          TF_VAR_discord_oauth_client_secret: ${{ secrets.DISCORD_OAUTH_CLIENT_SECRET }}
          TF_VAR_webhook_secret: ${{ secrets.AUTHENTIK_WEBHOOK_SECRET }}
          # OpenStack は clouds.yaml を介さず auth_url + OS_* 環境変数で認証する。
          # application credential は作成時のプロジェクトに固定され system スコープの
          # トークンを取れないため、project 作成を伴う root（catalog/*、members）は
          # enforce_scope が有効な環境では別途 system スコープの認証情報が要る。
          OS_AUTH_URL: ${{ secrets.LC_CLOUD_AUTH_URL }}
          OS_AUTH_TYPE: v3applicationcredential
          OS_REGION_NAME: RegionOne
          OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.LC_CLOUD_APP_CRED_ID }}
          OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.LC_CLOUD_APP_CRED_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_TERRAFORM_TOKEN }}
        run: |
          terraform init
          terraform apply -auto-approve

  apply-phase2:
    needs: [detect-changes, apply-phase1]
    if: |
      always() &&
      (needs.apply-phase1.result == 'success' || needs.apply-phase1.result == 'skipped') &&
      needs.detect-changes.outputs.phase2 != '[]'
    strategy:
      matrix:
        stack: ${{ fromJson(needs.detect-changes.outputs.phase2) }}
      fail-fast: false
    concurrency:
      group: apply-${{ matrix.stack }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # state 置き場の GCS バケットへ Workload Identity 連携で認証する。
      # サービスアカウントキーは発行しない（鍵の持ち回りが要らない）。
      - name: GCP 認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/897661050223/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-tfstate@main-vcompute.iam.gserviceaccount.com

      # scripts/decrypt-members.sh が使う。ubuntu-latest には同梱されていない
      - name: sops インストール
        run: |
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: SOPS 復号キー設定
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt

      - name: メンバーファイル復号
        run: scripts/decrypt-members.sh

      - name: Apply
        working-directory: ${{ matrix.stack }}
        env:
          TF_VAR_authentik_token: ${{ secrets.AUTHENTIK_TOKEN }}
          # OpenStack は clouds.yaml を介さず auth_url + OS_* 環境変数で認証する。
          # application credential は作成時のプロジェクトに固定され system スコープの
          # トークンを取れないため、project 作成を伴う root（catalog/*、members）は
          # enforce_scope が有効な環境では別途 system スコープの認証情報が要る。
          OS_AUTH_URL: ${{ secrets.LC_CLOUD_AUTH_URL }}
          OS_AUTH_TYPE: v3applicationcredential
          OS_REGION_NAME: RegionOne
          OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.LC_CLOUD_APP_CRED_ID }}
          OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.LC_CLOUD_APP_CRED_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_TERRAFORM_TOKEN }}
        run: |
          terraform init
          terraform apply -auto-approve

  apply-phase3:
    needs: [detect-changes, apply-phase2]
    if: |
      always() &&
      (needs.apply-phase2.result == 'success' || needs.apply-phase2.result == 'skipped') &&
      needs.detect-changes.outputs.phase3 != '[]'
    strategy:
      matrix:
        stack: ${{ fromJson(needs.detect-changes.outputs.phase3) }}
      fail-fast: false
    concurrency:
      group: apply-${{ matrix.stack }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # state 置き場の GCS バケットへ Workload Identity 連携で認証する。
      # サービスアカウントキーは発行しない（鍵の持ち回りが要らない）。
      - name: GCP 認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/897661050223/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-tfstate@main-vcompute.iam.gserviceaccount.com

      # scripts/decrypt-members.sh が使う。ubuntu-latest には同梱されていない
      - name: sops インストール
        run: |
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: SOPS 復号キー設定
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt

      - name: メンバーファイル復号
        run: scripts/decrypt-members.sh

      - name: Apply
        working-directory: ${{ matrix.stack }}
        env:
          TF_VAR_authentik_token: ${{ secrets.AUTHENTIK_TOKEN }}
          # OpenStack は clouds.yaml を介さず auth_url + OS_* 環境変数で認証する。
          # application credential は作成時のプロジェクトに固定され system スコープの
          # トークンを取れないため、project 作成を伴う root（catalog/*、members）は
          # enforce_scope が有効な環境では別途 system スコープの認証情報が要る。
          OS_AUTH_URL: ${{ secrets.LC_CLOUD_AUTH_URL }}
          OS_AUTH_TYPE: v3applicationcredential
          OS_REGION_NAME: RegionOne
          OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.LC_CLOUD_APP_CRED_ID }}
          OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.LC_CLOUD_APP_CRED_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_TERRAFORM_TOKEN }}
        run: |
          terraform init
          terraform apply -auto-approve

  apply-phase4:
    needs: [detect-changes, apply-phase3]
    if: |
      always() &&
      (needs.apply-phase3.result == 'success' || needs.apply-phase3.result == 'skipped') &&
      needs.detect-changes.outputs.phase4 != '[]'
    strategy:
      matrix:
        stack: ${{ fromJson(needs.detect-changes.outputs.phase4) }}
      fail-fast: false
    concurrency:
      group: apply-${{ matrix.stack }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: プロジェクト名の導出
        id: project
        run: |
          echo "name=$(echo '${{ matrix.stack }}' | awk -F'/' '{print $NF}')" \
            >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # state 置き場の GCS バケットへ Workload Identity 連携で認証する。
      # サービスアカウントキーは発行しない（鍵の持ち回りが要らない）。
      - name: GCP 認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/897661050223/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-tfstate@main-vcompute.iam.gserviceaccount.com

      # scripts/decrypt-members.sh が使う。ubuntu-latest には同梱されていない
      - name: sops インストール
        run: |
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: SOPS 復号キー設定
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt

      - name: メンバーファイル復号
        run: scripts/decrypt-members.sh

      - name: Apply（制限済み Application Credential を使用）
        working-directory: ${{ matrix.stack }}
        env:
          OS_APPLICATION_CREDENTIAL_ID: >-
            ${{ secrets[format('LC_CLOUD_APP_CRED_ID_{0}',
              steps.project.outputs.name)] }}
          OS_APPLICATION_CREDENTIAL_SECRET: >-
            ${{ secrets[format('LC_CLOUD_APP_CRED_SECRET_{0}',
              steps.project.outputs.name)] }}
        run: |
          terraform init
          terraform apply -auto-approve
