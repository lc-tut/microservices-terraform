name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/platform/**'
      - 'terraform/catalog/**'
      - 'terraform/workspaces/**'
      - 'terraform/modules/**'

permissions:
  contents: read
  pull-requests: write
  # GCS backend への Workload Identity 連携で OIDC トークンを発行するのに必要
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          changed=$(git diff --name-only origin/main)

          # platform/ は backend.tf を持つ最も近い祖先ディレクトリを root module
          # とする（idp/ のようなフラット構成と openstack/quotas/ のような
          # ネスト構成が混在するため。scripts/detect-platform-stacks.sh 参照）
          platform_stacks=$(echo "$changed" | scripts/detect-platform-stacks.sh)

          other_stacks=$(echo "$changed" \
            | grep -E '^terraform/(catalog|workspaces)/' \
            | awk -F'/' '{print $1"/"$2"/"$3"/"$4}')

          stacks=$(printf '%s\n%s\n' "$platform_stacks" "$other_stacks" \
            | grep -v '^$' | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect-changes
    if: needs.detect-changes.outputs.stacks != '[]'
    strategy:
      matrix:
        stack: ${{ fromJson(needs.detect-changes.outputs.stacks) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # state 置き場の GCS バケットへ Workload Identity 連携で認証する。
      # サービスアカウントキーは発行しない（鍵の持ち回りが要らない）。
      - name: GCP 認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/897661050223/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-tfstate@main-vcompute.iam.gserviceaccount.com

      # scripts/decrypt-members.sh が使う。ubuntu-latest には同梱されていない
      - name: sops インストール
        run: |
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: SOPS 復号キー設定
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt

      - name: メンバーファイル復号
        run: scripts/decrypt-members.sh

      - name: Validate & Format Check
        working-directory: ${{ matrix.stack }}
        run: |
          terraform init -backend=false
          terraform validate
          terraform fmt -check

      - name: Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ matrix.stack }}
          soft_fail: true

      - name: Plan
        id: plan
        working-directory: ${{ matrix.stack }}
        env:
          # middleware-api-infra 用の非秘密 JSON。他 root では未宣言のため無視される。
          TF_VAR_vm_config: ${{ vars.MIDDLEWARE_API_VM_CONFIG }}
          TF_VAR_authentik_token: ${{ secrets.AUTHENTIK_TOKEN }}
          # OpenStack は clouds.yaml を介さず auth_url + OS_* 環境変数で認証する。
          # application credential は作成時のプロジェクトに固定され system スコープの
          # トークンを取れないため、project 作成を伴う root（catalog/*、members）は
          # enforce_scope が有効な環境では別途 system スコープの認証情報が要る。
          OS_AUTH_URL: ${{ secrets.LC_CLOUD_AUTH_URL }}
          OS_AUTH_TYPE: v3applicationcredential
          OS_REGION_NAME: RegionOne
          OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.LC_CLOUD_APP_CRED_ID }}
          OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.LC_CLOUD_APP_CRED_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_TERRAFORM_TOKEN }}
        run: |
          terraform init
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: PR コメントに結果を投稿
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('${{ matrix.stack }}/plan.txt', 'utf8')
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌'
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ${status} Plan: \`${{ matrix.stack }}\`\n\`\`\`\n${plan.slice(-60000)}\n\`\`\``
            })

      - name: Plan 失敗時に CI を失敗させる
        if: steps.plan.outcome == 'failure'
        run: exit 1
