name: Modules Breaking Change Check

on:
  pull_request:
    paths:
      - 'terraform/modules/**'

permissions:
  contents: read
  pull-requests: write
  # GCS backend への Workload Identity 連携で OIDC トークンを発行するのに必要
  id-token: write

jobs:
  detect-stacks:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          stacks=$(find terraform -name 'backend.tf' -exec dirname {} \; \
            | sort \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  # modules/ 配下の terraform test。provider を持たないモジュールの
  # 契約（グループ名の命名規則など）を固定する。認証情報を必要としないため
  # plan-all とは独立に、stack が無いときでも必ず走らせる。
  module-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: terraform test
        run: |
          failed=0
          for dir in $(find terraform/modules -type d -name tests | sort); do
            mod="$(dirname "$dir")"
            echo "::group::$mod"
            (cd "$mod" && terraform init -backend=false -no-color && terraform test -no-color) || failed=1
            echo "::endgroup::"
          done
          exit $failed

  plan-all:
    needs: detect-stacks
    if: needs.detect-stacks.outputs.stacks != '[]'
    strategy:
      matrix:
        stack: ${{ fromJson(needs.detect-stacks.outputs.stacks) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # state 置き場の GCS バケットへ Workload Identity 連携で認証する。
      # サービスアカウントキーは発行しない（鍵の持ち回りが要らない）。
      - name: GCP 認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/897661050223/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-tfstate@main-vcompute.iam.gserviceaccount.com

      # scripts/decrypt-members.sh が使う。ubuntu-latest には同梱されていない
      - name: sops インストール
        run: |
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: SOPS 復号キー設定
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt

      - name: Plan
        id: plan
        working-directory: ${{ matrix.stack }}
        env:
          TF_VAR_authentik_token: ${{ secrets.AUTHENTIK_TOKEN }}
          OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.LC_CLOUD_APP_CRED_ID }}
          OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.LC_CLOUD_APP_CRED_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_TERRAFORM_TOKEN }}
        run: |
          terraform init
          terraform plan -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: 破壊的変更を PR コメントに投稿
        if: steps.plan.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('${{ matrix.stack }}/plan.txt', 'utf8')
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ❌ modules 変更による破壊的変更検出: \`${{ matrix.stack }}\`\n\`\`\`\n${plan.slice(-60000)}\n\`\`\``
            })

      - name: Plan 失敗時に CI を失敗させる
        if: steps.plan.outcome == 'failure'
        run: exit 1
